<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="field">
        <div class="tools">
            <button onclick="set_draw(this)" type="button" class="button active">Draw</button>
            <button onclick="eraser(this)" type="button" class="button">Eraser</button>
            <button onclick="undo_last()" type="button" class="button">Undo</button>
            <button onclick="clear_canvas()" type="button" class="button">Clean</button>
        </div>

        <div class="workspace">
            <div class="top-bar">
                <input onInput="draw_color = this.value" type="color" class="color-picker">
                <input onInput="draw_width = this.value" type="range" min="1" max="100" class="pen-range">

                <div onClick= "change_color(this)" class="color-field" style="background: red;"></div>
                <div onClick= "change_color(this)" class="color-field" style="background: green;"></div>
                <div onClick= "change_color(this)" class="color-field" style="background: yellow;"></div>
                <div onClick= "change_color(this)" class="color-field" style="background: purple;"></div>
                <div onclick="stamp_star(this)" class="stamp_icon">★</div>
                <div onclick="stamp_flower(this)" class="stamp_icon">✿</div>
                <div onclick="stamp_snow(this)" class="stamp_icon">❄</div>
                <div onclick="stamp_cloud(this)" class="stamp_icon">☁</div>
        </div>
        
        <canvas id="canvas"></canvas>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
